name: Publish to npm (Manual Only)

# This workflow is DISABLED for automatic runs as npm requires interactive authentication.
# Publishing to npm must be done manually using: bun run release:manual
# The workflow_dispatch trigger is kept for documentation purposes only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'This workflow is disabled. Use "bun run release:manual" locally instead.'
        required: true
        default: "disabled"

jobs:
  publish-npm:
    name: Publish Packages to npm
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Fail with instructions
        run: |
          echo "❌ This workflow is disabled as npm requires interactive authentication."
          echo ""
          echo "📦 To publish packages to npm, run locally:"
          echo "   bun run release:manual"
          echo ""
          echo "ℹ️  Packages are automatically published to GitHub Packages via CI."
          exit 1
