name: Build

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner label
        required: true
        type: string
      platform:
        description: Platform identifier (linux-x64, darwin-arm64, darwin-x64, win32-x64)
        required: true
        type: string

jobs:
  build:
    name: Build Packages (${{ inputs.platform }})
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun tooling
        uses: ./.github/actions/setup-bun

      - name: Install Bun dependencies
        uses: ./.github/actions/install-bun-deps

      - name: Build packages in dependency order
        run: bun x turbo run build --cache-dir=node_modules/.cache/turbo

      - name: Build WASM artifacts
        if: inputs.platform == 'linux-x64'
        run: bun ./.github/scripts/build-wasm.ts

      - name: Prepare upload directory
        run: bun ./.github/scripts/prepare-upload.ts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-packages-${{ inputs.platform }}
          path: upload/packages
          retention-days: 7
