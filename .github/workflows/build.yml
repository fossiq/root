name: Build

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner label
        required: true
        type: string
      platform:
        description: Platform identifier (linux-x64, darwin-arm64, darwin-x64, win32-x64)
        required: true
        type: string

jobs:
  build:
    name: Build Packages (${{ inputs.platform }})
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun & Dependencies
        uses: ./.github/actions/setup-bun

      - name: Build packages in dependency order
        run: bun x turbo run build --cache-dir=node_modules/.cache/turbo

      - name: Build WASM artifacts
        if: inputs.platform == 'linux-x64'
        run: |
          cd packages/kql-parser
          bun run build:wasm

      - name: Prepare upload directory
        run: |
          mkdir -p upload/packages
          for pkg in packages/*; do
            name=$(basename "$pkg")
            mkdir -p "upload/packages/$name"
            if [ -d "$pkg/dist" ]; then
              cp -r "$pkg/dist" "upload/packages/$name/"
            fi
          done
          if [ -f packages/kql-parser/tree-sitter-kql.wasm ]; then
            mkdir -p upload/packages/kql-parser
            cp packages/kql-parser/tree-sitter-kql.wasm upload/packages/kql-parser/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-packages-${{ inputs.platform }}
          path: upload/packages
          retention-days: 7
