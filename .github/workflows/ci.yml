name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    packages: write
    pull-requests: write

jobs:
    lint:
        name: Lint
        uses: ./.github/workflows/lint.yml

    build:
        name: Build
        needs: lint
        uses: ./.github/workflows/build.yml

    test:
        name: Test
        needs: build
        uses: ./.github/workflows/test.yml

    publish:
        name: Publish
        if: github.event_name != 'pull_request'
        needs: [test, build]
        uses: ./.github/workflows/publish.yml
        secrets:
            npm-token: ${{ secrets.NPM_TOKEN }}
            github-token: ${{ secrets.GITHUB_TOKEN }}
