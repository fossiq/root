name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    packages: write
    pull-requests: write

jobs:
    lint:
        name: Lint
        uses: ./.github/workflows/lint.yml

    build:
        name: Build
        needs: lint
        uses: ./.github/workflows/build.yml

    test:
        name: Test
        needs: build
        uses: ./.github/workflows/test.yml

    publish-npm:
        name: Publish to npm
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        needs: [test, build]
        uses: ./.github/workflows/publish-npm.yml
        secrets:
            npm-token: ${{ secrets.NPM_TOKEN }}
            github-token: ${{ secrets.GITHUB_TOKEN }}

    deploy-ui:
        name: Deploy UI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        needs: [test, build]
        uses: ./.github/workflows/deploy-ui.yml
        secrets:
            deploy-key: ${{ secrets.DEPLOY_KEY_GITHUB_IO }}
