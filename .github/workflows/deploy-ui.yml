name: Deploy UI

on:
  workflow_call:
    secrets:
      deploy-key-github-io:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ui:
    name: Deploy UI to GitHub Pages
    runs-on: ubuntu-latest
    environment: ui-deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup tooling
        uses: ./.github/actions/setup

      - name: Build all packages
        run: bun run build

      - name: Deploy to fossiq.github.io
        run: bun ./.github/scripts/trigger-ui-deploy.ts
        env:
          DEPLOY_KEY_GITHUB_IO: ${{ secrets.deploy-key-github-io }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
