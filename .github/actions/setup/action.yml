name: Setup Tooling & Dependencies
description: Setup Bun runtime, restore/install node_modules, and cache Turborepo outputs

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: cache-restore
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Setup Bun runtime
      uses: oven-sh/setup-bun@v2

    - name: Cache for Turbo
      uses: rharkor/caching-for-turbo@v2.2.1

    - name: Setup node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        package-manager-cache: false

    - name: Setup Tree-sitter CLI globally
      uses: tree-sitter/setup-action@v2

    - name: Install dependencies
      shell: bash
      run: bun install --no-scripts --verbose
